# Everything on one EC2 instance: Postgres, the API, the web app and Caddy for HTTPS.
# DOMAIN and POSTGRES_PASSWORD come from the .env file next to this one.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kwais
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kwais
    volumes:
      - kwais-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kwais -d kwais"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 2
      DATABASE_URL: postgresql://kwais:${POSTGRES_PASSWORD}@db:5432/kwais?schema=public
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. kwais.duckdns.org}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kwais-db:
  caddy-data:
  caddy-config:
