services:
  db:
    image: postgres:16-alpine
    container_name: kwais-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kwais
      POSTGRES_PASSWORD: kwais_dev_password
      POSTGRES_DB: kwais
    ports:
      - "5432:5432"
    volumes:
      - kwais-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kwais -d kwais"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kwais-db-data:
